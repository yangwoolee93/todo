<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img"
    aria-label="OX icon">
    <defs>
        <!-- 2. 상자와 동일한 좌상→우하 고정 방향 -->
        <linearGradient id="box-gradient" x1="112" y1="112" x2="912" y2="912" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2a2a2a" />
            <stop offset="55%" stop-color="#1a1a1a" />
            <!-- 3. 끝 색 밝게 -->
            <stop offset="100%" stop-color="#121212" />
        </linearGradient>
    </defs>

    <rect id="background" width="1024" height="1024" fill="#fff" opacity="0" />

    <g id="checkbox" filter="url(#box-shadow)">
        <rect x="112" y="112" width="800" height="800" rx="160" fill="url(#box-gradient)" />
        <!-- 1. 체크 단색 + 글로우만 -->
        <path d="M312 487 L437 612 L712 362" fill="none" stroke="#4ade80" stroke-width="90" stroke-linecap="round"
            stroke-linejoin="round" filter="url(#check-glow)" />
    </g>
</svg>