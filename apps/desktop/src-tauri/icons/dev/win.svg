<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#007a6e" />
            <stop offset="50%" stop-color="#00ffd0" />
            <stop offset="100%" stop-color="#b8fff4" />
        </linearGradient>
        <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#005a52" />
            <stop offset="50%" stop-color="#00a894" />
            <stop offset="100%" stop-color="#00d4b4" />
        </linearGradient>
        <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00c8b0" />
            <stop offset="50%" stop-color="#00ffd0" />
            <stop offset="100%" stop-color="#e8fffb" />
        </linearGradient>
        <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <circle cx="512" cy="512" r="512" fill="#2a2a2a" />
    <g filter="url(#neon)">
        <g transform="translate(512 512)">
            <path d="M 0 -213 L -75 -75 L -213 0 L -75 75 L 0 213 L 75 75 L 213 0 L 75 -75 Z" fill="url(#gradDark)" />
            <path d="M 0 -213 L 75 -75 L 0 0 Z M 213 0 L 75 75 L 0 0 Z M 0 213 L -75 75 L 0 0 Z M -213 0 L -75 -75 L 0 0 Z"
                fill="url(#gradLight)" />
        </g>
        <circle cx="512" cy="512" r="341" fill="none" stroke="url(#grad)" stroke-width="213"
            stroke-linecap="round" />
    </g>
</svg>
