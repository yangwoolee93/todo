<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <!-- React·CSS 전에 테마 클래스를 붙여 WebView 첫 페인트부터 배경이 맞게 한다. -->
    <script>
      (function () {
        var mode = localStorage.getItem("todo-theme-mode") || "auto";
        var isDark =
          mode === "dark" ||
          (mode === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
    <style>
      html {
        background: #ebe8e1;
      }
      html.dark {
        background: #121212;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: inherit;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
