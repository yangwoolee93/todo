    />

  <body>
    <header>

    <main>
      <h1>할 일과 메모를 한곳에서</h1>
      <p>
        Orbit는 데스크톱에서 쓰는 할 일·메모 앱입니다. 데이터는 기본적으로 이
        기기에 저장되고, Google 계정으로 로그인하면 그 계정의 Drive로 동기화할
        수 있습니다. 별도의 서버는 두지 않습니다.
      </p>
      <div class="card">
        <p>
          동기화하면 Drive에 <strong>Orbit</strong> 폴더를 만들고, 그 안에 데이터
          파일·안내 파일·백업 1개를 둡니다. 앱이 만든 파일만 다루며, Drive의
          다른 파일은 읽지 않습니다.
        </p>
      </div>
      <p>
        Google 로그인과 Drive 접근 방식은
        <a href="./privacy.html">개인정보 처리방침</a>에서 확인할 수 있습니다.
      </p>
    </main>
