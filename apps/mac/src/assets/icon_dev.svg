<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. 딥 다크 테마 배경 그라데이션 -->
    <linearGradient id="darkBgGrad" x1="200" y1="80" x2="824" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- 배경 상단 은은한 내부 테두리 하이라이트 -->
    <linearGradient id="innerRimGrad" x1="512" y1="64" x2="512" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- macOS 스쿼클(Squircle) 딥 다크 배경 -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#darkBgGrad)" />
  <rect x="64.75" y="64.75" width="894.5" height="894.5" rx="199.25" stroke="url(#innerRimGrad)" stroke-width="1.5" />

  <!-- 두꺼운 열린 호 (Arc): 아쿠아 민트(#5EEAD4) 단색, r=290, 두께 116 -->
  <circle cx="512" cy="512" r="290" stroke="#5EEAD4" stroke-width="116" stroke-linecap="round" stroke-dasharray="1410 1822" transform="rotate(-28 512 512)" />

  <!-- 중앙 4각 별: 중간 비율(451/573) + 시계 방향 2색 교차(인접 면 겹침 없음) -->
  <g>
    <!-- 1. 상단 우 (밝은 민트) -->
    <polygon points="512,340 573,451 512,512" fill="#99F6E4" />
    <!-- 2. 우측 상 (미드 민트) -->
    <polygon points="684,512 573,451 512,512" fill="#2DD4BF" />
    <!-- 3. 우측 하 (밝은 민트) -->
    <polygon points="684,512 573,573 512,512" fill="#99F6E4" />
    <!-- 4. 하단 우 (미드 민트) -->
    <polygon points="512,684 573,573 512,512" fill="#2DD4BF" />
    <!-- 5. 하단 좌 (밝은 민트) -->
    <polygon points="512,684 451,573 512,512" fill="#99F6E4" />
    <!-- 6. 좌측 하 (미드 민트) -->
    <polygon points="340,512 451,573 512,512" fill="#2DD4BF" />
    <!-- 7. 좌측 상 (밝은 민트) -->
    <polygon points="340,512 451,451 512,512" fill="#99F6E4" />
    <!-- 8. 상단 좌 (미드 민트) -->
    <polygon points="512,340 451,451 512,512" fill="#2DD4BF" />
  </g>
</svg>