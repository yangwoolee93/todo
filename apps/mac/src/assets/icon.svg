<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. 딥 다크 테마 배경 그라데이션 -->
    <linearGradient id="darkBgGrad" x1="200" y1="80" x2="824" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- 배경 상단 은은한 내부 테두리 하이라이트 -->
    <linearGradient id="innerRimGrad" x1="512" y1="64" x2="512" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- 2. 외곽 호(Arc) 그라데이션: 초록(진행/성공) -> 연보라(메인) -> 주황(전환/이탈) -->
    <linearGradient id="arcLavenderSpectrum" x1="220" y1="220" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="28%" stop-color="#A78BFA" />
      <stop offset="68%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>

  <!-- macOS 스쿼클(Squircle) 딥 다크 배경 -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#darkBgGrad)" />
  <rect x="64.75" y="64.75" width="894.5" height="894.5" rx="199.25" stroke="url(#innerRimGrad)" stroke-width="1.5" />

  <!-- 두꺼운 열린 호 (Arc): r=290 (원둘레 약 1822), 두께 116 -->
  <circle cx="512" cy="512" r="290" stroke="url(#arcLavenderSpectrum)" stroke-width="116" stroke-linecap="round" stroke-dasharray="1410 1822" transform="rotate(-28 512 512)" />

  <!-- 중앙 4각 별 (연보라 메인 컬러 기반 8면 입체 분할) -->
  <g>
    <!-- 상단 좌/우 -->
    <polygon points="512,340 573,451 512,512" fill="#DDD6FE" />
    <polygon points="684,512 573,451 512,512" fill="#C4B5FD" />
    <!-- 우측 상/하 -->
    <polygon points="684,512 573,573 512,512" fill="#A78BFA" />
    <polygon points="512,684 573,573 512,512" fill="#8B5CF6" />
    <!-- 하단 우/좌 -->
    <polygon points="512,684 451,573 512,512" fill="#7C3AED" />
    <polygon points="340,512 451,573 512,512" fill="#6D28D9" />
    <!-- 좌측 하/상 -->
    <polygon points="340,512 451,451 512,512" fill="#8B5CF6" />
    <polygon points="512,340 451,451 512,512" fill="#C4B5FD" />
  </g>
</svg>